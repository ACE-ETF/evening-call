name: Auto Update Korea Market Radar

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 평일 KST 16:30 1차 반영 (지수·수급 잠정·업종·ETF·브리핑)
    - cron: '15 8 * * 1-5'   # 평일 KST 17:15 마감 기사·브리핑 보강 (필요할 때만)
    - cron: '5 9 * * 1-5'    # 평일 KST 18:05 확정: 시간외 거래 반영 수급으로 최종 갱신
    - cron: '25 9 * * 1-5'   # 평일 KST 18:25 확정 예비 (18:05 실행이 늦거나 실패한 경우만)
  workflow_dispatch:
    inputs:
      force_update:
        description: '같은 거래일이어도 강제로 다시 수집 (1=예)'
        required: false
        default: '0'
      kind:
        description: 'auto(시각으로 판단: 평일 09:30~15:20=장중, 그 외=마감) / intraday / close'
        required: false
        default: 'auto'

permissions:
  contents: write

concurrency:
  group: market-radar-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || '0' }}
          KIND: ${{ github.event.inputs.kind || 'auto' }}
        run: |
          if [ "$KIND" = "auto" ]; then
            HM=$(date +%H%M); DOW=$(date +%u)
            if [ "$DOW" -le 5 ] && [ "$HM" -ge 930 ] && [ "$HM" -lt 1520 ]; then KIND=intraday; else KIND=close; fi
          fi
          echo "실행 종류: $KIND ($(date +'%m-%d %H:%M'))"
          if [ "$KIND" = "intraday" ]; then python intraday.py; else python fetch_market.py; fi

      - name: Commit & push data.json (변경이 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data.json intraday.json history; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --staged --quiet; then
            echo "변경 사항 없음(휴장일/중복 실행) - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update market data ($(date +'%Y-%m-%d %H:%M'))"
          git pull --rebase origin ${{ github.ref_name }}
          git push
