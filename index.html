<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Korea Market Radar · 한국 증시 마감 레이더</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1e232d;
    --line: #2a303c;
    --grid: #232833;
    --text: #e7eaf0;
    --text-2: #b9c0cd;
    --muted: #8b93a5;
    --up: #ef4f4f;      /* 한국 관례: 상승/순매수 = 빨강 */
    --down: #3d8bfd;    /* 하락/순매도 = 파랑 */
    --accent: #f5b942;
    --ace: #557eaa;      /* ACE 브랜드 컬러 (로고 배경) */
    --ace-ink: #ffffff;  /* ACE 바탕 위 글자 */
    --ace-text: #9dbbe0; /* 어두운 배경 위 ACE 글자용 밝은 톤 */
    --ok: #3ccf91;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .meta b { color: var(--text); font-weight: 600; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; vertical-align: middle; margin-left: 6px; }
  .badge.warn { background: rgba(245,185,66,.15); color: var(--accent); border: 1px solid rgba(245,185,66,.35); }
  .badge.ok { background: rgba(60,207,145,.12); color: var(--ok); border: 1px solid rgba(60,207,145,.3); }
  .badge.stale { background: rgba(139,147,165,.15); color: var(--muted); border: 1px solid var(--line); }

  .controls { display: flex; gap: 10px; align-items: center; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13.5px; font-family: inherit; }
  .seg button.active { background: var(--accent); color: #1a1406; }
  .seg.small button { padding: 4px 10px; font-size: 12.5px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; font-family: inherit; }
  .btn:hover { border-color: var(--accent); }

  .grid { display: grid; gap: 14px; }
  .g-brief { grid-template-columns: 1.65fr 1fr; align-items: start; }
  .g-kpi { grid-template-columns: repeat(4, 1fr); }
  .g-2 { grid-template-columns: 1fr 1fr; align-items: start; }
  .g-flow { grid-template-columns: 1.4fr 1fr; align-items: start; }
  @media (max-width: 960px) {
    .g-kpi { grid-template-columns: repeat(2, 1fr); }
    .g-brief, .g-2, .g-flow { grid-template-columns: 1fr; }
  }
  .section { margin-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .card h2 { margin: 0; font-size: 14px; color: var(--text-2); font-weight: 700; letter-spacing: .01em; }
  .sub { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: 6px; }

  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* 브리핑 */
  .brief { border-left: 3px solid var(--accent); }
  .brief .headline { font-size: 19px; font-weight: 800; line-height: 1.45; letter-spacing: -0.01em; margin: 2px 0 12px; }
  .brief ul { margin: 0; padding-left: 0; list-style: none; }
  .brief li { position: relative; padding: 6px 0 6px 16px; border-top: 1px dashed var(--line); font-size: 14.5px; color: var(--text); }
  .brief li:first-child { border-top: 0; }
  .brief li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .brief li b.topic { color: var(--text-2); font-weight: 700; }
  .brief h3 { font-size: 13px; color: var(--accent); margin: 14px 0 4px; font-weight: 700; }
  .cite { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 0 4px; border: 1px solid rgba(245,185,66,.4); border-radius: 4px; margin-left: 3px; line-height: 16px; vertical-align: 1px; }
  .cite:hover { background: rgba(245,185,66,.15); }
  .src { margin-top: 12px; color: var(--muted); font-size: 12px; }
  .part { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .part:first-of-type { margin-top: 4px; }
  .part .no { color: var(--accent); font-weight: 800; font-size: 13px; letter-spacing: .04em; }
  .part h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .part .desc { color: var(--muted); font-size: 12.5px; }
  .summary { background: rgba(245,185,66,.07); border: 1px solid rgba(245,185,66,.25); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .summary .lbl { font-size: 12px; font-weight: 800; color: var(--accent); margin-bottom: 4px; letter-spacing: .02em; }
  .summary ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .summary li { counter-increment: s; position: relative; padding: 5px 0 5px 26px; font-size: 15px; font-weight: 600; line-height: 1.5; border: 0; }
  .summary li::before { content: counter(s); position: absolute; left: 0; top: 7px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #1a1406; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .bsec { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .bsec { grid-template-columns: 1fr; } }
  .bsec .blk { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  .bsec .blk.strat { background: rgba(60,207,145,.07); border: 1px solid rgba(60,207,145,.25); }
  .bsec .blk h4 { margin: 0 0 4px; font-size: 12.5px; font-weight: 800; color: var(--text-2); }
  .bsec .blk.strat h4 { color: var(--ok); }
  .bsec .blk li { font-size: 13.5px; padding: 4px 0 4px 14px; }
  .bsec .blk li::before { top: 12px; width: 4px; height: 4px; background: var(--muted); }

  .news ol { margin: 0; padding: 0; list-style: none; }
  .news li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .news li:first-child { border-top: 0; padding-top: 0; }
  .news .n { flex: none; width: 20px; height: 20px; border-radius: 5px; background: var(--panel-2); color: var(--accent); font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .news a { text-decoration: none; font-size: 14px; font-weight: 600; line-height: 1.45; }
  .news a:hover { color: var(--accent); }
  .news .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .news li.hl { background: rgba(245,185,66,.08); border-radius: 6px; }

  /* KPI */
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 23px; font-weight: 700; margin-top: 2px; }
  .kpi .chg { font-size: 14.5px; font-weight: 600; }
  .kpi .chg span { color: var(--muted); font-size: 12px; font-weight: 500; }
  .spark { display: block; width: 100%; height: 38px; margin-top: 8px; }

  /* 수급 표 */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }

  /* 시장 폭 */
  .breadth-row { margin-bottom: 14px; }
  .breadth-row:last-child { margin-bottom: 0; }
  .breadth-row .t { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text-2); }
  .bbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; }
  .bbar div { min-width: 2px; }

  /* 가로 막대 차트 (발산형) */
  .hbar { width: 100%; }
  .hrow { display: grid; grid-template-columns: 118px 1fr 64px; align-items: center; gap: 8px; height: 24px; cursor: default; border-radius: 4px; }
  .hrow:hover { background: var(--panel-2); }
  .hrow .nm { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  .hrow .vl { font-size: 13px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; padding-right: 4px; }
  .track { position: relative; height: 12px; }
  .track .axis { position: absolute; left: 50%; top: -6px; bottom: -6px; width: 1px; background: var(--line); }
  .track i { position: absolute; top: 0; bottom: 0; }
  .track i.pos { left: 50%; border-radius: 0 4px 4px 0; background: var(--up); }
  .track i.neg { right: 50%; border-radius: 4px 0 0 4px; background: var(--down); }
  .hbar.cols-2 { column-count: 2; column-gap: 18px; }
  .hbar.cols-2 .hrow { break-inside: avoid; }
  @media (max-width: 960px) { .hbar.cols-2 { column-count: 1; } }

  /* 업종 수급 리스트 */
  .flowlist h4 { font-size: 12.5px; margin: 0 0 6px; font-weight: 700; }
  .flowlist .hrow { grid-template-columns: 96px 1fr 72px; }
  .stacked { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 640px) { .stacked { grid-template-columns: 1fr; } }

  .etf .hrow { grid-template-columns: minmax(120px, 270px) 1fr 64px; }
  @media (max-width: 640px) { .hrow { grid-template-columns: 96px 1fr 60px; } .etf .hrow { grid-template-columns: 140px 1fr 60px; } }
  .ace-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
  .ace-stats div { background: var(--panel-2); border-radius: 10px; padding: 8px 12px; border-left: 3px solid var(--ace); }
  .ace-stats .k { display: block; color: var(--muted); font-size: 12px; }
  .ace-stats b { font-size: 18px; }
  .ace-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
  .ace-grid .hrow { grid-template-columns: minmax(90px, 170px) 1fr 60px; }
  @media (max-width: 960px) { .ace-grid { grid-template-columns: 1fr; } .ace-stats { grid-template-columns: repeat(2, 1fr); } }
  .topbar { position: sticky; top: 0; z-index: 5; background: rgba(15,18,24,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin: 0 -20px 6px; padding: 8px 20px; border-bottom: 1px solid var(--line); }
  .tb-row { display: flex; align-items: center; gap: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips a { flex: none; text-decoration: none; font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .chips a.on { color: #1a1406; background: var(--accent); border-color: var(--accent); }
  .part, details.theme { scroll-margin-top: 64px; }
  details.blk > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  details.blk > summary::-webkit-details-marker { display: none; }
  details.blk > summary h4 { margin: 0; }
  details.blk > summary::after { content: "▾"; color: var(--muted); font-size: 12px; transition: transform .15s; }
  details.blk[open] > summary::after { transform: rotate(180deg); }
  details.blk[open] > summary { margin-bottom: 4px; }
  details.blk .cnt { color: var(--muted); font-size: 11.5px; font-weight: 600; margin-left: 6px; }
  .nu { color: #f7d3d3; }   /* 흰색에 가까운 아주 옅은 빨강: 상승·순매수 수치 */
  .nd { color: #d3e2fb; }   /* 흰색에 가까운 아주 옅은 파랑: 하락·순매도 수치 */
  .asof { color: var(--muted); font-size: 11.5px; margin: -6px 0 10px; line-height: 1.45; }
  .asof-kpi { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.6; }
  .bsec .blk.ace-blk { border: 1px solid rgba(85,126,170,.6); }
  .bsec .blk.ace-blk h4 { color: var(--ace-text); }
  .gist { font-size: 14.5px; font-weight: 700; color: var(--text); margin-top: 2px; line-height: 1.4; }
  .bsec .blk h4 { font-size: 11.5px; color: var(--accent); letter-spacing: .04em; }
  .kv { margin-top: 8px; border-top: 1px solid var(--line); }
  .kv-row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; line-height: 1.5; align-items: baseline; }
  .kv-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .kv-row .kk { color: var(--text-2); font-weight: 700; font-size: 12.5px; word-break: keep-all; }
  .kv-row .kk.dot::before { content: "·"; color: var(--muted); }
  .kv-row .vv { color: var(--text); }
  details.blk > summary { align-items: flex-start; }
  details.blk > summary::after { margin-top: 2px; }
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 1100px) { .themes { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .themes { grid-template-columns: 1fr; gap: 8px; } }
  details.theme { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  details.theme > summary { list-style: none; cursor: pointer; }
  details.theme > summary::-webkit-details-marker { display: none; }
  .theme .th { display: flex; justify-content: space-between; align-items: baseline; }
  .theme .tname { font-weight: 800; font-size: 14px; }
  .theme .tcnt { color: var(--muted); font-size: 11px; font-weight: 600; margin-left: 6px; }
  .theme .tmed { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .theme .tsub { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-top: 6px; }
  .achip { font-size: 11px; font-weight: 700; color: var(--ace-text); background: rgba(85,126,170,.22); border: 1px solid rgba(85,126,170,.6); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .achip.none { color: var(--muted); background: transparent; border-color: var(--line); }
  .tlist { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
  .trow { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--grid); }
  .trow .tbody { min-width: 0; display: flex; flex-direction: column; }
  .trow .tm { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 1px; line-height: 1.4; }
  .trow .rk { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; }
  .trow .tp { text-align: right; }
  .tpl { display: block; font-size: 10px; color: var(--muted); font-weight: 600; line-height: 1.1; }
  .tlist.flat { margin-top: 0; border-top: 0; padding-top: 0; }
  .trow:last-child { border-bottom: 0; }
  .trow .tn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .tp { font-variant-numeric: tabular-nums; font-weight: 600; }
  .trow.ace .tn { font-weight: 700; color: var(--text); }
  .trow:not(.ace) .tn { color: var(--muted); }
  .atag { font-size: 10px; font-weight: 800; color: var(--ace-ink); background: var(--ace); border-radius: 4px; text-align: center; padding: 1px 0; }
  .otag { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; text-align: center; padding: 0; }
  .heat-wrap { overflow-x: auto; }
  table.heat { width: 100%; border-collapse: separate; border-spacing: 0 3px; }
  table.heat th { text-align: right; font-size: 11.5px; padding: 2px 8px; }
  table.heat th:first-child { text-align: left; }
  table.heat td { border: 0; padding: 6px 8px; font-size: 13px; }
  table.heat tr[data-jump] { cursor: pointer; }
  table.heat tr[data-jump]:hover td { filter: brightness(1.25); }
  table.heat td.hn { background: var(--panel-2); border-radius: 6px 0 0 6px; white-space: nowrap; }
  table.heat td.hn b { font-size: 13px; }
  table.heat .hb { display: block; color: var(--muted); font-size: 10.5px; font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  table.heat td.hc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); width: 72px; }
  table.heat td.ha { width: 54px; text-align: right; background: var(--panel-2); border-radius: 0 6px 6px 0; }
  @media (max-width: 640px) { table.heat td.hc { width: auto; padding: 6px 5px; font-size: 12px; } table.heat .hb { max-width: 110px; } table.heat td.ha { display: none; } }
  .theme .tbn { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drivers { margin-top: 8px; padding: 8px 10px; background: rgba(255,255,255,.03); border-radius: 8px; }
  .drivers .dh { font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 4px; }
  .drivers .dh small { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .drivers .dl { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12.5px; margin-top: 3px; }
  .drivers .dk { font-size: 11px; font-weight: 700; margin-right: 2px; }
  .drv small { color: var(--muted); margin-left: 2px; font-size: 10.5px; }
  .drv small::before { content: "("; } .drv small::after { content: ")"; }
  .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 960px) { .picks { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .picks { grid-template-columns: 1fr; gap: 8px; } }
  .pick { background: var(--panel-2); border-radius: 10px; padding: 12px; border-top: 3px solid var(--ace); display: flex; flex-direction: column; gap: 6px; }
  .pick .ph { display: flex; align-items: center; gap: 6px; }
  .pick .ph .atag { padding: 1px 6px; }
  .pick .pt { font-size: 11.5px; color: var(--ace-text); font-weight: 700; }
  .pick .pcode { margin-left: auto; color: var(--muted); font-size: 11px; }
  .pick .pn { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .pick .pr { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .pick .pr .tm { color: var(--muted); font-size: 11px; text-align: right; }
  .pick .pr .tp { font-size: 17px; font-weight: 800; text-align: left; }
  .pick .pp { font-size: 13px; color: var(--text-2); border-top: 1px dashed var(--line); padding-top: 6px; }
  .more { display: block; width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; border: 1px dashed var(--line); background: transparent; color: var(--text-2); font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .gap-row { text-align: center; color: var(--muted); font-size: 12px; line-height: 14px; }
  @media (max-width: 640px) {
    .wrap { padding: 14px 14px 40px; }
    .topbar { margin: 0 -14px 4px; padding: 8px 14px; }
    header { margin-bottom: 8px; }
    h1 { font-size: 18px; }
    .hide-m { display: none; }
    .seg button { padding: 6px 10px; }
    .part { margin: 22px 0 10px; }
    .part .desc { display: none; }
    .card { padding: 14px; }
    .g-kpi { gap: 8px; }
    .kpi .value { font-size: 19px; }
    .kpi .chg { font-size: 13.5px; }
    .kpi .chg span { display: none; }
    .spark { height: 26px; margin-top: 4px; }
    .brief .headline { font-size: 17px; }
    .summary li { font-size: 14.5px; }
    .card-h { margin-bottom: 8px; }
    .tb-row { gap: 6px; }
    .chips { gap: 4px; }
    .chips a { padding: 5px 9px; font-size: 12.5px; }
    .seg button { padding: 5px 9px; font-size: 12.5px; }
    #btnCopy { padding: 6px 9px; }
  }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: 0; }

  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .state { text-align: center; color: var(--muted); padding: 60px 20px; }
  .tip { position: fixed; z-index: 10; pointer-events: none; background: #0b0e13; border: 1px solid var(--line); color: var(--text); font-size: 12.5px; padding: 8px 10px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); opacity: 0; transition: opacity .1s; max-width: 260px; line-height: 1.5; }
  .tip.show { opacity: 1; }
  .tip b { font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #1a1406; font-weight: 700; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: all .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🇰🇷 Korea Market <span>Radar</span></h1>
      <div class="meta" id="meta">데이터 불러오는 중…</div>
    </div>
  </header>
  <div class="topbar">
    <div class="tb-row">
      <div class="seg" id="modeSeg">
        <button data-v="daily" class="active">일간</button>
        <button data-v="weekly">주간<span class="hide-m"> 5D</span></button>
      </div>
      <nav class="chips">
        <a href="#p1">요약</a><a href="#p2">수급</a><a href="#p3">업종</a><a href="#p4">종목</a><a href="#p5">테마</a><a href="#p6">ACE</a>
      </nav>
      <button class="btn" id="btnCopy" title="브리핑 요약 복사">📋<span class="hide-m"> 요약 복사</span></button>
    </div>
  </div>

  <div id="app"><div class="state">데이터 불러오는 중…</div></div>

  <footer>
    매 평일 16:30(KST) 1차 반영 · 17:15 마감 기사 보강 · 18:05 수급 확정 (GitHub 예약 실행 특성상 수 분~수십 분 지연될 수 있음) · 데이터: KRX(pykrx), FinanceDataReader, Google News · 투자 판단의 참고 자료이며 투자 권유가 아닙니다.
  </footer>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast">복사되었습니다</div>

<script>
(function () {
  "use strict";

  var DATA = null;
  var S = { mode: "daily", siMkt: "kospi", sfMkt: "kospi", sfInv: "smart", tsInv: "foreign" };
  try {
    var saved = JSON.parse(localStorage.getItem("kmr_state") || "null");
    if (saved) for (var k in S) if (saved[k]) S[k] = saved[k];
  } catch (e) {}
  function save() { try { localStorage.setItem("kmr_state", JSON.stringify(S)); } catch (e) {} }

  var INV = [["foreign", "외국인"], ["inst", "기관"], ["retail", "개인"]];
  var INV_LABEL = { foreign: "외국인", inst: "기관", retail: "개인", smart: "외국인+기관" };

  // ---------- 유틸 ----------
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : (d || 0); }
  function fmt(v, digits) { return num(v).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
  function pct(v) { var n = num(v); return (n > 0 ? "+" : "") + n.toFixed(2) + "%"; }
  function eok(v) { var n = num(v); return (n > 0 ? "+" : "") + Math.round(n).toLocaleString("ko-KR"); }
  function cls(v) { var n = num(v); return n > 0 ? "up" : (n < 0 ? "down" : "flat"); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pk() { return S.mode === "daily" ? "daily_pct" : "weekly_pct"; }
  function modeLabel() { return S.mode === "daily" ? "일간" : "5거래일"; }
  function asOf(key) {
    var a = (DATA && DATA.as_of) || {};
    return a[key] ? '<div class="asof">기준 · ' + esc(a[key]) + '</div>' : "";
  }
  function staleBadge(o) { return o && o.stale ? '<span class="badge stale" title="이번 수집에 실패해 이전 값을 표시합니다">이전값</span>' : ""; }
  function seg(id, items, cur, small) {
    return '<div class="seg' + (small ? " small" : "") + '" data-seg="' + id + '">' + items.map(function (it) {
      return '<button data-v="' + it[0] + '" class="' + (it[0] === cur ? "active" : "") + '">' + it[1] + '</button>';
    }).join("") + '</div>';
  }

  // ---------- 로드 ----------
  function load() {
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (json) {
        if (!json || !json.indices) throw new Error("데이터 형식 오류");
        DATA = json; render();
      })
      .catch(function (err) {
        document.getElementById("meta").textContent = "데이터를 불러오지 못했습니다.";
        document.getElementById("app").innerHTML = '<div class="card state">data.json을 불러오지 못했습니다 (' + esc(err.message) + ').</div>';
      });
  }

  // ---------- 렌더 ----------
  function render() {
    if (!DATA) return;
    renderMeta();
    function part(no, title, desc) { return '<div class="part" id="p' + (+no) + '"><span class="no">' + no + '</span><h2>' + title + '</h2><span class="desc">' + desc + '</span></div>'; }
    var h = "";
    h += part("01", "오늘 시장 요약", "지수 → 결론 → 총평 → 파트별 근거 → 대응");
    h += '<div class="grid g-kpi">' + kpiCards() + '</div>';
    var ao = DATA.as_of || {};
    if (ao.index) h += '<div class="asof-kpi">기준 · 지수: ' + esc(ao.index) + ' · 환율: ' + esc(ao.fx || "-") + ' · ' + esc(ao.sox || "") + '</div>';
    h += '<div class="grid g-brief section">' + briefCard() + newsCard() + '</div>';
    h += part("02", "수급", "투자자별 매매와 시장 체감");
    h += '<div class="grid g-flow">' + flowCard() + breadthCard() + '</div>';
    h += part("03", "업종", "어디가 오르고, 돈은 어디로 갔나");
    h += sectorIndexCard();
    h += '<div class="section">' + sectorFlowCard() + '</div>';
    h += part("04", "종목", "주체별 순매수·순매도 상위 종목");
    h += topStocksCard();
    h += part("05", "테마·ETF", "전체 테마 흐름 → 테마별 ACE 라인업 · 비교 · 움직인 종목");
    h += themeHeatmap();
    h += '<div class="section">' + themeCard() + '</div>';
    var pk6 = acePicksCard();
    if (pk6) { h += part("06", "오늘의 ACE ETF", "오늘 시장 흐름과 함께 볼 만한 ACE 상품"); h += pk6; }
    document.getElementById("app").innerHTML = h;
    bindSegs();
    bindMore();
  }

  // ---------- 모바일: 접기·더보기 ----------
  var MQ = window.matchMedia("(max-width: 640px)");
  function isM() { return MQ.matches; }
  if (MQ.addEventListener) MQ.addEventListener("change", function () { render(); });
  var MORE = {};
  function limitRows(key, rows, n) {
    if (!isM() || MORE[key] || rows.length <= n) return { rows: rows, btn: "" };
    return { rows: rows.slice(0, n), btn: '<button class="more" data-more="' + key + '">더보기 (' + (rows.length - n) + '개) ▾</button>' };
  }
  function bindMore() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-more]"), function (b) {
      b.addEventListener("click", function () { MORE[b.getAttribute("data-more")] = true; render(); });
    });
  }

  function renderMeta() {
    var q = DATA.data_quality || {};
    var stale = (q.stale_items || []).length;
    var badge = "";
    if (q.is_today === false) badge += '<span class="badge warn">직전 거래일 기준</span>';
    if (q.final === false) badge += '<span class="badge warn" title="수급은 시간외 거래 반영 후 18:05에 확정됩니다">수급 잠정</span>';
    else if (q.final === true) badge += '<span class="badge ok">수급 확정</span>';
    if (stale > 0) badge += '<span class="badge warn" title="' + esc((q.stale_items || []).join(", ")) + '">이전값 ' + stale + '개</span>';
    if (!badge) badge = '<span class="badge ok">정상 수집</span>';
    document.getElementById("meta").innerHTML =
      '기준 거래일 <b>' + esc(DATA.trade_date || "-") + '</b> · 업데이트 ' + esc(DATA.updated_at || "-") + badge;
  }

  // 부호 있는 수치 강조: +는 빨강, -는 파랑
  var NUM_RE = /([+\-−▲▼])\s?(\d[\d,]*(?:\.\d+)?)(\s?조(?:\s?[\d,]+억)?|\s?억|%p|%|pt)?(\s?원)?/g;
  function hlNum(t) {
    return t.replace(NUM_RE, function (m, sign) {
      var c = (sign === "+" || sign === "▲") ? "nu" : "nd";
      return '<span class="' + c + '">' + m + '</span>';
    });
  }
  // 브리핑: [n] 인용을 기사 링크로, "주제:" 앞부분 강조
  function richText(s, noTopic) {
    var t = hlNum(esc(s));
    var m = noTopic ? null : t.match(/^([^:：<]{1,14})[:：]\s*/);
    if (m) t = '<b class="topic">' + m[1] + ':</b> ' + t.slice(m[0].length);
    // [1], [3, 5], [3,5] 형태 모두 처리
    return t.replace(/\[(\d{1,2}(?:\s*,\s*\d{1,2})*)\]/g, function (_, grp) {
      return grp.split(/\s*,\s*/).map(function (n) {
        var it = newsById(+n);
        return it ? '<a class="cite" href="' + esc(newsLink(it.link)) + '" target="_blank" rel="noopener" data-cite="' + n + '" title="' + esc(it.title) + '">' + n + '</a>' : "";
      }).join("");
    });
  }
  function newsLink(u) { return String(u || "").replace("news.google.com/rss/articles/", "news.google.com/articles/"); }
  function newsById(n) {
    var items = (DATA.news && DATA.news.items) || [];
    for (var i = 0; i < items.length; i++) if (items[i].id === n) return items[i];
    return null;
  }

  function briefCard() {
    var br = DATA.ai_briefing || {};
    var b = br[S.mode];
    var body;
    if (b && b.headline && b.sections) {
      function lis(arr) { return '<ul>' + (arr || []).map(function (p) { return '<li>' + richText(p) + '</li>'; }).join("") + '</ul>'; }
      body = '<div class="headline">' + richText(b.headline) + '</div>' +
        ((b.summary && b.summary.length) ? '<div class="summary"><div class="lbl">총평</div><ol>' + b.summary.map(function (p) { return '<li>' + richText(p) + '</li>'; }).join("") + '</ol></div>' : "") +
        '<div class="bsec">' + b.sections.map(function (sc) {
          var items = sc.items || (sc.points || []).map(function (x) { return { k: "", v: x }; });
          var rows = items.map(function (it) {
            return '<div class="kv-row">' + (it.k ? '<span class="kk">' + esc(it.k) + '</span>' : '<span class="kk dot"></span>') +
              '<span class="vv">' + richText(it.v, true) + '</span></div>';
          }).join("");
          return '<details class="blk' + (sc.key === "ace" ? " ace-blk" : "") + '"' + (isM() ? "" : " open") + '><summary><div><h4>' + esc(sc.title) + '</h4>' +
            (sc.gist ? '<div class="gist">' + richText(sc.gist, true) + '</div>' : "") + '</div></summary><div class="kv">' + rows + '</div></details>';
        }).join("") +
        ((b.strategy && b.strategy.length) ? '<div class="blk strat"><h4>대응 포인트</h4>' + lis(b.strategy) + '</div>' : "") + '</div>';
    } else if (b && b.headline) {
      body = '<div class="headline">' + richText(b.headline) + '</div>' +
        '<ul>' + (b.points || []).map(function (p) { return '<li>' + richText(p) + '</li>'; }).join("") + '</ul>' +
        ((b.strategy && b.strategy.length) ? '<h3>대응 포인트</h3><ul>' + b.strategy.map(function (p) { return '<li>' + richText(p) + '</li>'; }).join("") + '</ul>' : "");
    } else {
      var legacy = S.mode === "daily" ? br.daily_comment : br.weekly_comment;
      body = '<div class="headline" style="font-size:16px;font-weight:600">' + esc(legacy || "브리핑 데이터가 없습니다.") + '</div>';
    }
    return '<div class="card brief"><div class="card-h"><h2>시황 브리핑<span class="sub">' + modeLabel() + ' 기준</span></h2></div>' + asOf("briefing") + body +
      '<div class="src">' + (br.source === "gemini" ? esc(br.model || "Gemini") + " 작성" : "규칙 기반 자동 요약") +
      ' · 수치 기반 자동 생성 · 투자 권유 아님</div></div>';
  }

  function newsCard() {
    var n = DATA.news || {};
    var lim = limitRows("news", n.items || [], 3);
    var items = lim.rows;
    var list = items.length ? '<ol>' + items.map(function (it) {
      return '<li id="news-' + it.id + '"><span class="n">' + it.id + '</span><div><a href="' + esc(newsLink(it.link)) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>' +
        '<div class="m">' + esc(it.source) + (it.published ? " · " + esc(it.published) : "") + '</div></div></li>';
    }).join("") + '</ol>' + lim.btn : '<div class="empty">관련 기사를 불러오지 못했습니다.</div>';
    var q = DATA.data_quality || {};
    var pc = q.news_post_close;
    var note = (pc != null && pc < 4 && q.is_today) ? '<span class="badge warn" title="장 마감 기사가 나오면 17:15에 기사와 브리핑을 자동 보강합니다">마감 기사 보강 예정</span>' :
      (pc != null ? '<span class="sub">마감 후 기사 ' + pc + '건</span>' : "");
    return '<div class="card news"><div class="card-h"><h2>관련 기사' + staleBadge(n) + note + '</h2></div>' + asOf("news") + list + '</div>';
  }

  // ---------- KPI + 스파크라인 ----------
  function spark(series, up) {
    if (!series || series.length < 2) return "";
    var w = 200, h = 38, pad = 3;
    var vals = series.map(function (p) { return p.c; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var rng = mx - mn || 1;
    var pts = vals.map(function (v, i) {
      return (pad + i * (w - pad * 2) / (vals.length - 1)).toFixed(1) + "," + (h - pad - (v - mn) / rng * (h - pad * 2)).toFixed(1);
    });
    var color = up ? "var(--up)" : "var(--down)";
    var tip = "<b>최근 " + series.length + "거래일</b><br>" + series[0].d + " " + fmt(series[0].c, 2) + " → " + series[series.length - 1].d + " " + fmt(series[series.length - 1].c, 2) +
      "<br>고점 " + fmt(mx, 2) + " · 저점 " + fmt(mn, 2);
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" data-tip="' + esc(tip) + '">' +
      '<polyline fill="none" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="' + pts.join(" ") + '"/>' +
      '<circle cx="' + pts[pts.length - 1].split(",")[0] + '" cy="' + pts[pts.length - 1].split(",")[1] + '" r="2.5" fill="' + color + '"/></svg>';
  }

  function kpiCards() {
    var I = DATA.indices || {};
    return [
      ["kospi", "KOSPI", 2, "pt"], ["kosdaq", "KOSDAQ", 2, "pt"],
      ["usdkrw", "원/달러 환율", 1, "원"], ["sox", "필라델피아 반도체 · 전일 미국장", 2, ""]
    ].map(function (k) {
      var o = I[k[0]] || {}; var v = num(o[pk()]);
      var series = o.series || [];
      var trendUp = series.length > 1 ? series[series.length - 1].c >= series[0].c : v >= 0;
      return '<div class="card kpi"><div class="label">' + k[1] + staleBadge(o) + '</div>' +
        '<div class="value num">' + fmt(o.price, k[2]) + '<small style="font-size:13px;color:var(--muted);font-weight:500"> ' + k[3] + '</small></div>' +
        '<div class="chg num ' + cls(v) + '">' + pct(v) + ' <span>' + (S.mode === "daily" ? "전일 대비" : "5거래일") + '</span></div>' +
        spark(series, trendUp) + '</div>';
    }).join("");
  }

  // ---------- 투자자 수급 ----------
  function flowCard() {
    var F = DATA.flow || {};
    var p = S.mode;
    var rows = [["kospi", "코스피"], ["kosdaq", "코스닥"]].map(function (m) {
      var o = F[m[0]] || {};
      return '<tr><td>' + m[1] + staleBadge(o) + '</td>' + INV.map(function (iv) {
        var v = o[p + "_" + iv[0]];
        return '<td class="' + cls(v) + '"><b>' + (v == null ? "-" : eok(v)) + '</b></td>';
      }).join("") + '</tr>';
    }).join("");
    var q = DATA.data_quality || {};
    var prov = q.final === false ? (q.is_today ? '<span class="badge warn" title="시간외 거래(~18:00)가 포함되어 18:05에 확정치로 갱신됩니다">잠정 · 18:05 확정</span>' : '<span class="badge warn" title="확정 갱신 전 수집된 값입니다">잠정치</span>') : (q.final === true ? '<span class="badge ok">확정</span>' : "");
    return '<div class="card"><div class="card-h"><h2>투자자별 순매수<span class="sub">' + modeLabel() + ' · 억 원</span>' + prov + '</h2></div>' + asOf("flow") +
      '<table><thead><tr><th>시장</th><th>외국인</th><th>기관</th><th>개인</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function breadthCard() {
    var B = DATA.breadth || {};
    var body = [["kospi", "코스피"], ["kosdaq", "코스닥"]].map(function (m) {
      var o = B[m[0]] || {};
      var up = num(o.up), dn = num(o.down), fl = num(o.flat), tot = up + dn + fl;
      if (!tot) return '<div class="breadth-row"><div class="t">' + m[1] + '</div><div class="empty">데이터 없음</div></div>';
      var tip = "<b>" + m[1] + " 시장 폭</b><br>상승 " + up + " · 하락 " + dn + " · 보합 " + fl;
      return '<div class="breadth-row" data-tip="' + esc(tip) + '"><div class="t"><span>' + m[1] + staleBadge(o) + '</span><span class="num"><span class="up">▲' + up + '</span> · <span class="down">▼' + dn + '</span> · <span class="flat">' + fl + '</span></span></div>' +
        '<div class="bbar"><div style="flex:' + up + ';background:var(--up)"></div><div style="flex:' + fl + ';background:var(--line)"></div><div style="flex:' + dn + ';background:var(--down)"></div></div></div>';
    }).join("");
    return '<div class="card"><div class="card-h"><h2>시장 폭<span class="sub">상승·보합·하락 종목 수 (일간)</span></h2></div>' + asOf("breadth") + body + '</div>';
  }

  // ---------- 발산형 가로 막대 ----------
  function hbars(rows, opts) {
    // rows: [{name, v, tip}] / opts: {unit:"%"|"억", cols2:bool}
    if (!rows || !rows.length) return '<div class="empty">데이터 없음</div>';
    var maxAbs = opts.max || Math.max.apply(null, rows.map(function (r) { return Math.abs(num(r.v)); }).concat([opts.unit === "%" ? 0.5 : 1]));
    return '<div class="hbar' + (opts.cols2 ? " cols-2" : "") + '">' + rows.map(function (r) {
      var v = num(r.v); var w = Math.abs(v) / maxAbs * 50;
      var bar = v >= 0 ? '<i class="pos" style="width:' + w + '%"></i>' : '<i class="neg" style="width:' + w + '%"></i>';
      var label = opts.unit === "%" ? pct(v) : eok(v);
      return '<div class="hrow" data-tip="' + esc(r.tip || ("<b>" + esc(r.name) + "</b><br>" + label)) + '"><span class="nm">' + esc(r.name) + '</span>' +
        '<div class="track"><span class="axis"></span>' + bar + '</div><span class="vl ' + cls(v) + '">' + label + '</span></div>';
    }).join("") + '</div>';
  }

  function sectorIndexCard() {
    var si = (DATA.sector_indices || {})[S.siMkt] || {};
    var rows = (si[S.mode] || []).map(function (r) {
      return { name: r.name, v: r.pct, tip: "<b>" + esc(r.name) + "</b><br>" + modeLabel() + " " + pct(r.pct) + (r.value ? "<br>거래대금 " + Math.round(r.value).toLocaleString("ko-KR") + "억 원" : "") };
    });
    return '<div class="card"><div class="card-h"><h2>업종지수 수익률<span class="sub">' + modeLabel() + ' · 높은 순</span>' + staleBadge(si) + '</h2>' +
      seg("siMkt", [["kospi", "코스피"], ["kosdaq", "코스닥"]], S.siMkt, true) + '</div>' + asOf("sector") + siBody(rows) + '</div>';
  }
  function siBody(rows) {
    if (!isM() || MORE.si || rows.length <= 12) return hbars(rows, { unit: "%", cols2: true });
    var mx = Math.max.apply(null, rows.map(function (r) { return Math.abs(num(r.v)); }).concat([0.5]));
    return '<h4 class="up" style="font-size:12px;margin:0 0 4px">상위 5</h4>' + hbars(rows.slice(0, 5), { unit: "%", max: mx }) +
      '<h4 class="down" style="font-size:12px;margin:10px 0 4px">하위 5</h4>' + hbars(rows.slice(-5), { unit: "%", max: mx }) +
      '<button class="more" data-more="si">전체 ' + rows.length + '개 업종 보기 ▾</button>';
  }

  function sectorFlowCard() {
    var sf = DATA.sector_flow || {};
    var list = ((sf[S.mode] || {})[S.sfMkt] || []).map(function (r) {
      r = Object.assign({}, r);
      if (r.smart == null) r.smart = num(r.foreign) + num(r.inst);
      return r;
    });
    var key = S.sfInv;
    var sorted = list.slice().sort(function (a, b) { return num(b[key]) - num(a[key]); });
    function mk(r) {
      return { name: r.sector, v: r[key], tip: "<b>" + esc(r.sector) + "</b> (" + modeLabel() + ", 억 원)<br>외국인 " + eok(r.foreign) + " · 기관 " + eok(r.inst) + " · 개인 " + eok(r.retail) };
    }
    var nn = isM() ? 5 : 6;
    var buy = sorted.slice(0, nn).filter(function (r) { return num(r[key]) > 0; }).map(mk);
    var sell = sorted.slice(-nn).reverse().filter(function (r) { return num(r[key]) < 0; }).map(mk);
    var note = sf.partial ? '<span class="badge warn">일부 투자자 누락</span>' : "";
    return '<div class="card flowlist"><div class="card-h"><h2>업종별 수급 상·하위<span class="sub">' + modeLabel() + ' · 억 원</span>' + staleBadge(sf) + note + '</h2>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' + seg("sfMkt", [["kospi", "코스피"], ["kosdaq", "코스닥"]], S.sfMkt, true) +
      seg("sfInv", [["smart", "외+기"], ["foreign", "외국인"], ["inst", "기관"], ["retail", "개인"]], S.sfInv, true) + '</div></div>' + asOf("stock") +
      '<div class="stacked"><div><h4 class="up">순매수 상위</h4>' + hbars(buy, { unit: "억" }) + '</div>' +
      '<div><h4 class="down">순매도 상위</h4>' + hbars(sell, { unit: "억" }) + '</div></div></div>';
  }

  function topStocksCard() {
    var ts = DATA.top_stocks || {};
    var blk = ((ts[S.mode] || {})[S.tsInv]) || {};
    function tbl(rows, side) {
      if (!rows || !rows.length) return '<div class="empty">데이터 없음</div>';
      return '<table><tbody>' + rows.slice(0, isM() ? 5 : 7).map(function (r) {
        return '<tr data-tip="' + esc("<b>" + esc(r.name) + "</b> (" + esc(r.market) + ")<br>" + esc(r.sector) + "<br>" + INV_LABEL[S.tsInv] + " " + eok(r.value) + "억 원") + '"><td>' + esc(r.name) +
          '<div style="color:var(--muted);font-size:11.5px">' + esc(r.sector) + '</div></td><td class="' + cls(r.value) + '"><b>' + eok(r.value) + '</b></td></tr>';
      }).join("") + '</tbody></table>';
    }
    return '<div class="card"><div class="card-h"><h2>순매수·순매도 상위 종목<span class="sub">' + modeLabel() + ' · 억 원</span>' + staleBadge(ts) + '</h2>' +
      seg("tsInv", [["foreign", "외국인"], ["inst", "기관"], ["retail", "개인"]], S.tsInv, true) + '</div>' + asOf("stock") +
      '<div class="stacked"><div><h4 class="up" style="font-size:12.5px;margin:0 0 4px">순매수</h4>' + tbl(blk.buy, "buy") + '</div>' +
      '<div><h4 class="down" style="font-size:12.5px;margin:0 0 4px">순매도</h4>' + tbl(blk.sell, "sell") + '</div></div></div>';
  }

  function etfCard() {
    var rows = (DATA.sectors || []).map(function (s) {
      return { name: s.sector + " · " + s.name, v: s[pk()], stale: s.stale,
        tip: "<b>" + esc(s.name) + "</b> (" + esc(s.ticker) + ")<br>" + esc(s.sector) + "<br>현재가 " + fmt(s.price, 0) + "원 · " + modeLabel() + " " + pct(s[pk()]) };
    }).sort(function (a, b) { return num(b.v) - num(a.v); });
    return '<div class="card etf"><div class="card-h"><h2>섹터 대표 ETF 수익률<span class="sub">' + modeLabel() + '</span></h2></div>' +
      hbars(rows, { unit: "%" }) + '</div>';
  }

  function aceCard() {
    var A = DATA.ace || {};
    var a = A[S.mode];
    if (!a || !a.top) return '<div class="card"><div class="empty">ACE ETF 데이터가 아직 없습니다. 다음 자동 실행부터 표시됩니다.</div></div>';
    var k = (DATA.indices || {}).kospi || {};
    var tot = num(a.up) + num(a.down) + num(a.flat);
    var an = isM() ? 5 : 8;
    function rows(list) {
      return (list || []).slice(0, an).map(function (x) {
        return { name: x.name.replace(/^ACE\s+/, ""), v: x.pct,
          tip: "<b>" + esc(x.name) + "</b> (" + esc(x.code) + ")<br>" + modeLabel() + " " + pct(x.pct) + "<br>종가 " + fmt(x.price, 0) + "원 · 거래대금 " + Math.round(num(x.value)).toLocaleString("ko-KR") + "억" };
      });
    }
    var stats = '<div class="ace-stats">' +
      '<div><span class="k">ACE ETF' + (A.aum_total ? ' · 순자산 ' + aumFmt(A.aum_total) : "") + '</span><b class="num">' + num(A.count) + '종</b></div>' +
      '<div><span class="k">상승 · 하락</span><b class="num"><span class="up">' + num(a.up) + '</span> · <span class="down">' + num(a.down) + '</span></b></div>' +
      '<div><span class="k">수익률 중간값</span><b class="num ' + cls(a.median) + '">' + pct(a.median) + '</b></div>' +
      '<div><span class="k">코스피 대비</span><b class="num ' + cls(num(a.median) - num(k[pk()])) + '">' + (num(a.median) - num(k[pk()]) >= 0 ? "+" : "") + (num(a.median) - num(k[pk()])).toFixed(2) + '%p</b></div>' +
      '</div>' +
      (tot ? '<div class="bbar" style="margin:4px 0 16px" data-tip="' + esc("<b>ACE ETF 등락 분포</b><br>상승 " + a.up + " · 보합 " + a.flat + " · 하락 " + a.down) + '"><div style="flex:' + a.up + ';background:var(--up)"></div><div style="flex:' + a.flat + ';background:var(--line)"></div><div style="flex:' + a.down + ';background:var(--down)"></div></div>' : "");
    function list(arr) { return '<div class="tlist flat">' + (arr || []).slice(0, an).map(function (x, i) { return etfLine(x, String(i + 1)); }).join("") + '</div>'; }
    var big = a.aum_top ? ['aum_top', '순자산 상위'] : ['value_top', '거래대금 상위'];
    return '<div class="card"><div class="card-h"><h2><span style="color:var(--ace-text)">ACE</span> ETF 마감 성과<span class="sub">' + modeLabel() + '</span>' + staleBadge(A) + '</h2></div>' + asOf("etf") + stats +
      '<div class="ace-grid"><div><h4 class="up" style="font-size:12.5px;margin:0 0 6px">수익률 상위</h4>' + list(a.top) + '</div>' +
      '<div><h4 class="down" style="font-size:12.5px;margin:0 0 6px">수익률 하위</h4>' + list(a.bottom) + '</div>' +
      '<div><h4 style="font-size:12.5px;margin:0 0 6px;color:var(--text-2)">' + big[1] + '</h4>' + list(a[big[0]]) + '</div></div></div>';
  }

  // ---------- ETF 행 공통: 이름 · 현재 기간 수익률 / 순자산 · 1D · 1W · 1M ----------
  function aumFmt(v) {
    v = num(v); if (!v) return "-";
    return v >= 10000 ? (v / 10000).toFixed(v >= 100000 ? 0 : 1) + "조" : Math.round(v).toLocaleString("ko-KR") + "억";
  }
  function rv(x, k) { var v = x[k]; return v == null ? null : num(v); }
  function softPct(v) { return v == null ? "-" : '<span class="' + (v > 0 ? "nu" : v < 0 ? "nd" : "") + '">' + pct(v) + '</span>'; }
  function etfLine(x, tag) {
    var main = rv(x, S.mode === "daily" ? "d1" : "w1"); if (main == null) main = num(x.pct);
    var isAce = /^ACE\s/.test(x.name);
    var nm = isAce ? x.name.replace(/^ACE\s+/, "") : x.name;
    var meta = x.aum != null || x.d1 != null
      ? 'AUM ' + aumFmt(x.aum) + (S.mode === "daily" ? "" : ' · 1D ' + softPct(rv(x, "d1"))) + (S.mode === "weekly" ? "" : ' · 1W ' + softPct(rv(x, "w1"))) + ' · 1M ' + softPct(rv(x, "m1"))
      : '거래대금 ' + Math.round(num(x.value)).toLocaleString("ko-KR") + '억';
    var tip = "<b>" + esc(x.name) + "</b> (" + esc(x.code) + ")<br>순자산 " + aumFmt(x.aum) + " · 거래대금 " + Math.round(num(x.value)).toLocaleString("ko-KR") + "억<br>1D " + pct(rv(x, "d1")) + " · 1W " + pct(rv(x, "w1")) + " · 1M " + pct(rv(x, "m1"));
    var tg = tag === "ace" ? '<span class="atag">ACE</span>' : tag === "cmp" ? '<span class="otag">비교</span>' : '<span class="rk">' + esc(tag || "") + '</span>';
    return '<div class="trow' + (isAce ? " ace" : "") + '" data-tip="' + esc(tip) + '">' + tg +
      '<div class="tbody"><span class="tn">' + esc(nm) + '</span><span class="tm">' + meta + '</span></div>' +
      '<span class="tp ' + cls(main) + '"><small class="tpl">' + (S.mode === "daily" ? "1D" : "1W") + '</small>' + pct(main) + '</span></div>';
  }

  // ---------- 테마별 ETF (ACE 우선) ----------
  function themeKey() { return S.mode === "daily" ? "d1" : "w1"; }
  function benchOf(t) { return t.bench || { name: "테마 ETF 중간값", src: "ETF", d1: t.median, w1: t.median, m1: null }; }
  function benchLabel(b) { return b.src === "상위 ETF" ? "1위 " + b.name : b.src === "ETF 가중" ? "ETF AUM 가중" : b.name; }

  // 전체 테마 흐름: 테마 × 1D/1W/1M 히트맵
  function heatCell(v) {
    if (v == null) return '<td class="hc">-</td>';
    var a = Math.min(Math.abs(v) / 4, 1) * 0.55 + 0.06;
    var bg = v > 0 ? "rgba(239,79,79," + a.toFixed(2) + ")" : v < 0 ? "rgba(61,139,253," + a.toFixed(2) + ")" : "transparent";
    return '<td class="hc" style="background:' + bg + '">' + pct(v) + '</td>';
  }
  function themeHeatmap() {
    var list = (DATA.themes || {})[S.mode] || [];
    if (!list.length) return "";
    var k = themeKey();
    var sorted = list.slice().sort(function (a, b) { return num(benchOf(b)[k], -99) - num(benchOf(a)[k], -99); });
    var rows = sorted.map(function (t, i) {
      var b = benchOf(t);
      return '<tr data-jump="th-' + i + '" data-theme="' + esc(t.theme) + '"><td class="hn"><b>' + esc(t.theme) + '</b><span class="hb">' + esc(benchLabel(b)) + '</span></td>' +
        heatCell(b.d1) + heatCell(b.w1) + heatCell(b.m1) +
        '<td class="ha">' + (t.ace_count ? '<span class="achip">ACE ' + t.ace_count + '</span>' : "") + '</td></tr>';
    }).join("");
    return '<div class="card"><div class="card-h"><h2>전체 테마 흐름<span class="sub">기준지수 수익률 · ' + (S.mode === "daily" ? "1D" : "1W") + ' 높은 순 · 행을 누르면 상세로 이동</span></h2></div>' +
      '<div class="heat-wrap"><table class="heat"><thead><tr><th>테마 · 기준</th><th>1D</th><th>1W</th><th>1M</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="src">기준: 국내 테마는 한국거래소 KRX·테마 지수, 해외 테마는 대표 지수(미국·홍콩·인도 등은 국내 기준일 전날 종가), 맞는 지수가 없는 테마는 테마 안 수익률 1위 ETF(AUM 100억 이상)</div></div>';
  }

  function driversBlock(d) {
    if (!d || (!d.up.length && !d.down.length)) return "";
    function li(x) {
      return '<span class="drv" data-tip="' + esc("<b>" + esc(x.name) + "</b><br>평균 비중 " + x.w + "% · 1D " + pct(x.ret) + "<br>테마 기여 " + (x.c > 0 ? "+" : "") + x.c.toFixed(2) + "%p") + '">' +
        esc(x.name) + ' <span class="' + (x.ret > 0 ? "nu" : x.ret < 0 ? "nd" : "") + '">' + pct(x.ret) + '</span><small>' + x.w + '%</small></span>';
    }
    return '<div class="drivers"><div class="dh">움직인 종목 <small>' + (d.common ? "대표 ETF 공통 편입" : "대표 ETF 편입") + ' · 1D 기여 순 · 괄호 비중</small></div>' +
      (d.up.length ? '<div class="dl"><span class="dk up">끌어올림</span>' + d.up.map(li).join("") + '</div>' : "") +
      (d.down.length ? '<div class="dl"><span class="dk down">끌어내림</span>' + d.down.map(li).join("") + '</div>' : "") + '</div>';
  }

  function themeCard() {
    var T = DATA.themes || {};
    var list = (T[S.mode] || []).slice();
    if (!list.length) return '<div class="card"><div class="empty">테마별 ETF 데이터가 아직 없습니다. 다음 자동 실행부터 표시됩니다.</div></div>';
    var k = themeKey();
    list.sort(function (a, b) { return num(benchOf(b)[k], -99) - num(benchOf(a)[k], -99); });
    var lim = limitRows("themes", list, 8);
    var body = lim.rows.map(function (t, i) {
      var b = benchOf(t), v = b[k];
      var aceInfo = t.ace_count ? '<span class="achip">ACE ' + t.ace_count + '종' + (t.ace_median != null ? ' · 중간 ' + pct(t.ace_median) : "") + '</span>' : '<span class="achip none">ACE 없음</span>';
      var rows = (t.ace || []).map(function (x) { return etfLine(x, "ace"); }).join("") +
        (t.others || []).map(function (x) { return etfLine(x, "cmp"); }).join("");
      return '<details class="theme" id="th-' + i + '" data-theme="' + esc(t.theme) + '"' + (isM() ? "" : " open") + '><summary>' +
        '<div class="th"><span class="tname">' + esc(t.theme) + '</span><span class="tmed ' + cls(v) + '">' + (v == null ? "-" : pct(v)) + '</span></div>' +
        '<div class="tsub"><span class="tbn">' + esc(benchLabel(b)) + ' · 1W ' + softPct(b.w1 == null ? null : num(b.w1)) + ' · 1M ' + softPct(b.m1 == null ? null : num(b.m1)) + '</span>' + aceInfo + '</div></summary>' +
        driversBlock(t.drivers) + '<div class="tlist">' + rows + '</div></details>';
    }).join("");
    return '<div class="card"><div class="card-h"><h2>테마별 상세<span class="sub">' + modeLabel() + ' · ACE 라인업 우선 · 타사 비교</span>' + staleBadge(T) + '</h2></div>' + asOf("etf") +
      '<div class="themes">' + body + '</div>' + lim.btn +
      '<div class="src">테마 분류에서 레버리지·인버스·전략형(롱숏·헤지 등) 제외, 커버드콜은 별도 테마 · 정렬: ACE ' + modeLabel() + ' 수익률 상위 → 비교(타사, AUM 100억 이상) 수익률 상위 3 · 움직인 종목은 국내 주식 테마만(대표 ETF 구성종목 주 1회 갱신)</div></div>';
  }

  // 오늘의 ACE ETF 6종
  function acePicksCard() {
    var br = DATA.ai_briefing || {};
    var picks = br.ace_picks || [];
    if (!picks.length) return "";
    var cards = picks.map(function (x) {
      var main = rv(x, themeKey()); if (main == null) main = rv(x, "d1");
      return '<div class="pick"><div class="ph"><span class="atag">ACE</span><span class="pt">' + esc(x.theme || "") + '</span><span class="pcode">' + esc(x.code) + '</span></div>' +
        '<div class="pn">' + esc(x.name.replace(/^ACE\s+/, "")) + '</div>' +
        '<div class="pr"><span class="tp ' + cls(main) + '"><small class="tpl">' + (S.mode === "daily" ? "1D" : "1W") + '</small>' + pct(main) + '</span>' +
        '<span class="tm">AUM ' + aumFmt(x.aum) + (S.mode === "daily" ? "" : ' · 1D ' + softPct(rv(x, "d1"))) + (S.mode === "weekly" ? "" : ' · 1W ' + softPct(rv(x, "w1"))) + ' · 1M ' + softPct(rv(x, "m1")) + '</span></div>' +
        (x.point ? '<div class="pp">' + esc(x.point) + '</div>' : "") + '</div>';
    }).join("");
    return '<div class="card"><div class="card-h"><h2>오늘의 <span style="color:var(--ace-text)">ACE</span> ETF<span class="sub">오늘 시장 흐름과 함께 볼 만한 ACE 상품 ' + picks.length + '종</span></h2></div>' + asOf("etf") +
      '<div class="picks">' + cards + '</div>' +
      '<div class="src">' + (br.source === "gemini" ? esc(br.model || "Gemini") + "가 오늘 데이터 기준으로 선정·작성" : "규칙 기반 선정(강세 테마 대표 + 시장 상황별 코어·방어 상품)") + ' · 투자 권유가 아닌 참고용 정보이며, 투자 전 설명서와 약관을 확인하세요.</div></div>';
  }

  // ---------- 상호작용 ----------
  function bindSegs() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-seg]"), function (el) {
      el.addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        S[el.getAttribute("data-seg")] = b.getAttribute("data-v"); save(); render();
      });
    });
  }
  document.getElementById("modeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    S.mode = b.getAttribute("data-v"); save(); syncMode(); render();
  });
  function syncMode() {
    Array.prototype.forEach.call(document.querySelectorAll("#modeSeg button"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-v") === S.mode);
    });
  }

  document.addEventListener("click", function (e) {
    var tr = e.target.closest && e.target.closest("tr[data-theme]");
    if (!tr) return;
    var name = tr.getAttribute("data-theme");
    var el = document.querySelector('details.theme[data-theme="' + name.replace(/"/g, '\\"') + '"]');
    if (!el && !MORE.themes) { MORE.themes = true; render(); el = document.querySelector('details.theme[data-theme="' + name.replace(/"/g, '\\"') + '"]'); }
    if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  });

  // 상단 칩: 스크롤 위치에 따라 현재 파트 표시
  window.addEventListener("scroll", function () {
    var cur = "p1";
    Array.prototype.forEach.call(document.querySelectorAll(".part"), function (el) {
      if (el.getBoundingClientRect().top < 90) cur = el.id;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".chips a"), function (a) {
      a.classList.toggle("on", a.getAttribute("href") === "#" + cur);
    });
  }, { passive: true });

  // 툴팁 (마우스/터치)
  var tip = document.getElementById("tip");
  document.addEventListener("mousemove", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.classList.remove("show"); return; }
    tip.innerHTML = t.getAttribute("data-tip");
    var x = e.clientX + 14, y = e.clientY + 14;
    var r = tip.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
    tip.classList.add("show");
  });
  document.addEventListener("mouseover", function (e) {
    var c = e.target.closest && e.target.closest("[data-cite]");
    Array.prototype.forEach.call(document.querySelectorAll(".news li.hl"), function (li) { li.classList.remove("hl"); });
    if (c) { var li = document.getElementById("news-" + c.getAttribute("data-cite")); if (li) li.classList.add("hl"); }
  });

  // ---------- 요약 복사 ----------
  function buildSummary() {
    var br = (DATA.ai_briefing || {})[S.mode] || {};
    var I = DATA.indices || {}, F = DATA.flow || {}, k = pk(), p = S.mode;
    var L = [];
    L.push("[시황 브리핑] " + modeLabel() + " · 기준 거래일 " + (DATA.trade_date || "-"));
    if (br.headline) L.push("■ " + br.headline.replace(/\s*\[[\d,\s]+\]/g, ""));
    L.push("");
    function clean(x) { return x.replace(/\s*\[[\d,\s]+\]/g, ""); }
    if (br.summary && br.summary.length) { L.push("[총평]"); br.summary.forEach(function (x, i) { L.push((i + 1) + ") " + clean(x)); }); }
    (br.sections || []).forEach(function (sc) { L.push(""); L.push("[" + sc.title + "]"); sc.points.forEach(function (x) { L.push("- " + clean(x)); }); });
    (br.points || []).forEach(function (x) { L.push("- " + clean(x)); });
    if (br.strategy && br.strategy.length) { L.push(""); L.push("[대응 포인트]"); br.strategy.forEach(function (x) { L.push("- " + x.replace(/\s*\[[\d,\s]+\]/g, "")); }); }
    L.push("");
    L.push("[지수] KOSPI " + fmt((I.kospi || {}).price, 2) + "(" + pct((I.kospi || {})[k]) + ") / KOSDAQ " + fmt((I.kosdaq || {}).price, 2) + "(" + pct((I.kosdaq || {})[k]) + ") / 원달러 " + fmt((I.usdkrw || {}).price, 1) + "(" + pct((I.usdkrw || {})[k]) + ")");
    [["kospi", "코스피"], ["kosdaq", "코스닥"]].forEach(function (m) {
      var o = F[m[0]] || {};
      L.push("[" + m[1] + " 수급, 억] 외국인 " + eok(o[p + "_foreign"]) + " / 기관 " + eok(o[p + "_inst"]) + " / 개인 " + eok(o[p + "_retail"]));
    });
    var TT = ((DATA.themes || {})[p] || []).slice(0, 3);
    if (TT.length) L.push("[테마 강세] " + TT.map(function (t) { return t.theme + " " + pct(t.median) + (t.ace_median != null ? "(ACE " + pct(t.ace_median) + ")" : ""); }).join(", "));
    var A = (DATA.ace || {})[p];
    if (A && A.top) {
      L.push("[ACE ETF] 상승 " + A.up + " / 하락 " + A.down + " · 중간값 " + pct(A.median));
      L.push("  상위: " + A.top.slice(0, 3).map(function (x) { return x.name + " " + pct(x.pct); }).join(", "));
    }
    var refs = ((DATA.news || {}).items || []).slice(0, 5);
    if (refs.length) { L.push(""); L.push("[관련 기사]"); refs.forEach(function (n) { L.push(n.id + ". " + n.title + " (" + n.source + ")"); }); }
    return L.join("\n");
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 1600); }
  document.getElementById("btnCopy").addEventListener("click", function () {
    if (!DATA) return toast("데이터가 아직 없습니다");
    copyText(buildSummary()).then(function () { toast("브리핑이 복사되었습니다"); }, function () { toast("복사에 실패했습니다"); });
  });

  syncMode();
  load();
})();
</script>
