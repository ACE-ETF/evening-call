<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Korea Market Radar · 일간·주간 한국 증시 & 섹터 레이더</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1e232d;
    --line: #2a303c;
    --text: #e7eaf0;
    --muted: #8b93a5;
    --up: #ef4f4f;      /* 한국 관례: 상승 = 빨강 */
    --down: #3d8bfd;    /* 하락 = 파랑 */
    --accent: #f5b942;
    --ok: #3ccf91;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
  header {
    display: flex; flex-wrap: wrap; gap: 12px 20px;
    align-items: flex-end; justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .meta b { color: var(--text); font-weight: 600; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; vertical-align: middle; margin-left: 6px;
  }
  .badge.warn { background: rgba(245,185,66,.15); color: var(--accent); border: 1px solid rgba(245,185,66,.35); }
  .badge.ok { background: rgba(60,207,145,.12); color: var(--ok); border: 1px solid rgba(60,207,145,.3); }
  .badge.stale { background: rgba(139,147,165,.15); color: var(--muted); border: 1px solid var(--line); }

  .controls { display: flex; gap: 10px; align-items: center; }
  .toggle {
    display: inline-flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px;
  }
  .toggle button {
    border: 0; background: transparent; color: var(--muted);
    padding: 7px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .toggle button.active { background: var(--accent); color: #1a1406; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  .btn:hover { border-color: var(--accent); }

  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .flows { grid-template-columns: repeat(2, 1fr); }
  .main { grid-template-columns: 1.5fr 1fr; align-items: start; }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .main, .flows { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .card h2 {
    margin: 0 0 12px; font-size: 14px; color: var(--muted);
    font-weight: 600; letter-spacing: .01em;
  }
  .section { margin-top: 14px; }

  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .chg { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  .flow-row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px dashed var(--line); }
  .flow-row:first-of-type { border-top: 0; }
  .flow-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  .briefing {
    border-left: 3px solid var(--accent);
    background: linear-gradient(90deg, rgba(245,185,66,.06), transparent 60%), var(--panel);
  }
  .briefing p { margin: 0; font-size: 15.5px; }
  .briefing .src { margin-top: 10px; color: var(--muted); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; cursor: pointer; user-select: none; white-space: nowrap; }
  th.sorted { color: var(--accent); }
  td .name { font-weight: 600; }
  td .ticker { color: var(--muted); font-size: 12px; }
  .bar-cell { width: 110px; }
  .bar { position: relative; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; }
  .bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }

  .sim label { display: flex; justify-content: space-between; font-size: 14px; margin-top: 12px; }
  .sim label b { font-variant-numeric: tabular-nums; }
  .sim input[type=range] { width: 100%; accent-color: var(--accent); margin-top: 6px; }
  .alloc { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 16px; border: 1px solid var(--line); }
  .alloc div { transition: width .15s; }
  .legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); }
  .sim-out { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .sim-out .box { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  .sim-out .k { color: var(--muted); font-size: 12px; }
  .sim-out .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }

  .state { text-align: center; color: var(--muted); padding: 60px 20px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #1a1406; font-weight: 700; padding: 10px 18px;
    border-radius: 10px; opacity: 0; transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🇰🇷 Korea Market <span>Radar</span></h1>
      <div class="meta" id="meta">데이터 불러오는 중…</div>
    </div>
    <div class="controls">
      <div class="toggle" role="tablist" aria-label="기간 선택">
        <button id="btnDaily" class="active" data-mode="daily">일간 1D</button>
        <button id="btnWeekly" data-mode="weekly">주간 5D</button>
      </div>
      <button class="btn" id="btnCopy">📋 요약 복사</button>
    </div>
  </header>

  <div id="app"><div class="state">데이터 불러오는 중…</div></div>

  <footer>
    매 평일 16:30(KST) GitHub Actions 자동 갱신 · 데이터: FinanceDataReader, pykrx · 투자 판단의 참고 자료이며 투자 권유가 아닙니다.
  </footer>
</div>
<div class="toast" id="toast">복사되었습니다</div>

<script>
(function () {
  "use strict";

  // ---------- 상태 ----------
  var DATA = null;
  var MODE = "daily";               // "daily" | "weekly"
  var SORT = { key: "pct", dir: -1 };
  var SIM = { growth: 40, rotation: 40 };  // cash = 100 - growth - rotation

  // 시뮬레이터 가정 베타 (코스피 대비)
  var BETA = { growth: 1.35, rotation: 0.75, cash: 0.02 };

  try {
    var saved = JSON.parse(localStorage.getItem("kmr_sim") || "null");
    if (saved && typeof saved.growth === "number" && typeof saved.rotation === "number") SIM = saved;
    var savedMode = localStorage.getItem("kmr_mode");
    if (savedMode === "daily" || savedMode === "weekly") MODE = savedMode;
  } catch (e) {}

  // ---------- 유틸 ----------
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : (d || 0); }
  function fmt(v, digits) {
    return num(v).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function pct(v) { var n = num(v); return (n > 0 ? "+" : "") + n.toFixed(2) + "%"; }
  function signed(v) { var n = num(v); return (n > 0 ? "+" : "") + Math.round(n).toLocaleString("ko-KR"); }
  function cls(v) { var n = num(v); return n > 0 ? "up" : (n < 0 ? "down" : "flat"); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pctKey() { return MODE === "daily" ? "daily_pct" : "weekly_pct"; }
  function modeLabel() { return MODE === "daily" ? "일간(1D)" : "주간(5D)"; }
  function staleBadge(o) { return o && o.stale ? '<span class="badge stale" title="이번 수집에 실패해 이전 값을 표시합니다">이전값</span>' : ""; }

  // ---------- 데이터 로드 ----------
  function load() {
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (json) {
        if (!json || !json.indices) throw new Error("데이터 형식 오류");
        DATA = json;
        render();
      })
      .catch(function (err) {
        document.getElementById("meta").textContent = "데이터를 불러오지 못했습니다.";
        document.getElementById("app").innerHTML =
          '<div class="card state">data.json을 불러오지 못했습니다 (' + esc(err.message) + ').<br>' +
          'GitHub Actions에서 워크플로를 한 번 수동 실행(Run workflow)해 data.json을 생성해 주세요.</div>';
      });
  }

  // ---------- 렌더 ----------
  function render() {
    if (!DATA) return;
    renderMeta();
    var I = DATA.indices || {};
    var F = DATA.flow || {};
    var html = "";

    // AI 브리핑
    var br = DATA.ai_briefing || {};
    var comment = MODE === "daily" ? br.daily_comment : br.weekly_comment;
    html += '<div class="card briefing">' +
      '<h2>🧠 AI 시황 브리핑 · ' + modeLabel() + '</h2>' +
      '<p>' + esc(comment || "브리핑 데이터가 없습니다.") + '</p>' +
      '<div class="src">' + (br.source === "gemini" ? "Gemini 2.5 Flash 생성" : "규칙 기반 자동 요약") +
      ' · 수치 기반 자동 생성 문장으로 투자 권유가 아닙니다.</div></div>';

    // KPI
    var kpis = [
      { key: "kospi", label: "KOSPI", digits: 2, unit: "pt" },
      { key: "kosdaq", label: "KOSDAQ", digits: 2, unit: "pt" },
      { key: "usdkrw", label: "원/달러 환율", digits: 1, unit: "원", invert: true },
      { key: "sox", label: "필라델피아 반도체(SOX)", digits: 2, unit: "" }
    ];
    html += '<div class="grid kpis section">';
    kpis.forEach(function (k) {
      var o = I[k.key] || {};
      var v = num(o[pctKey()]);
      html += '<div class="card kpi">' +
        '<div class="label">' + k.label + staleBadge(o) + '</div>' +
        '<div class="value">' + fmt(o.price, k.digits) + '<small style="font-size:13px;color:var(--muted);font-weight:500"> ' + k.unit + '</small></div>' +
        '<div class="chg ' + cls(v) + '">' + pct(v) + ' <span style="color:var(--muted);font-size:12px;font-weight:500">' +
        (MODE === "daily" ? "전일 대비" : "5거래일") + (k.invert && v > 0 ? " · 원화 약세" : (k.invert && v < 0 ? " · 원화 강세" : "")) +
        '</span></div></div>';
    });
    html += '</div>';

    // 수급
    var fk = MODE === "daily" ? ["daily_foreign", "daily_inst"] : ["weekly_foreign", "weekly_inst"];
    html += '<div class="grid flows section">';
    [["kospi", "코스피"], ["kosdaq", "코스닥"]].forEach(function (m) {
      var o = F[m[0]] || {};
      html += '<div class="card"><h2>💰 ' + m[1] + ' 투자자 순매수 · ' + modeLabel() + staleBadge(o) + '</h2>' +
        '<div class="flow-row"><span>외국인</span><span class="v ' + cls(o[fk[0]]) + '">' + signed(o[fk[0]]) + '억 원</span></div>' +
        '<div class="flow-row"><span>기관</span><span class="v ' + cls(o[fk[1]]) + '">' + signed(o[fk[1]]) + '억 원</span></div>' +
        '</div>';
    });
    html += '</div>';

    // 섹터 + 시뮬레이터
    html += '<div class="grid main section">';
    html += '<div class="card"><h2>📡 업종별 대표 ETF 레이더 · ' + modeLabel() + '</h2>' + sectorTable() + '</div>';
    html += '<div class="card sim"><h2>🛡️ 변동성 방어 비중 시뮬레이터</h2>' + simMarkup() + '</div>';
    html += '</div>';

    document.getElementById("app").innerHTML = html;
    bindTable();
    bindSim();
    updateSim();
  }

  function renderMeta() {
    var q = DATA.data_quality || {};
    var stale = (q.stale_items || []).length;
    var badge = "";
    if (q.is_today === false) badge += '<span class="badge warn">최신 거래일 기준(휴장/장전)</span>';
    if (stale > 0) badge += '<span class="badge warn" title="' + esc((q.stale_items || []).join(", ")) + '">이전값 ' + stale + '개</span>';
    if (!badge) badge = '<span class="badge ok">정상 수집</span>';
    document.getElementById("meta").innerHTML =
      '기준 거래일 <b>' + esc(DATA.trade_date || "-") + '</b> · 업데이트 ' + esc(DATA.updated_at || "-") + badge;
  }

  // ---------- 섹터 테이블 ----------
  function sectorTable() {
    var rows = (DATA.sectors || []).map(function (s) {
      return {
        s: s,
        pct: num(s[pctKey()]),
        price: num(s.price),
        sector: s.sector || "",
        name: s.name || ""
      };
    });
    rows.sort(function (a, b) {
      var k = SORT.key;
      if (typeof a[k] === "string") return a[k].localeCompare(b[k], "ko") * SORT.dir;
      return (a[k] - b[k]) * SORT.dir;
    });
    var maxAbs = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.pct); }).concat([1]));

    function th(key, label) {
      var on = SORT.key === key;
      return '<th data-key="' + key + '" class="' + (on ? "sorted" : "") + '">' + label +
        (on ? (SORT.dir < 0 ? " ▼" : " ▲") : "") + '</th>';
    }
    var h = '<table><thead><tr>' + th("sector", "섹터") + th("name", "ETF") + th("price", "현재가") +
      th("pct", MODE === "daily" ? "1D" : "5D") + '<th class="bar-cell"></th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var w = Math.min(50, Math.abs(r.pct) / maxAbs * 50);
      var color = r.pct >= 0 ? "var(--up)" : "var(--down)";
      var pos = r.pct >= 0 ? "left:50%;width:" + w + "%" : "right:50%;width:" + w + "%";
      h += '<tr><td>' + esc(r.sector) + '</td>' +
        '<td><div class="name">' + esc(r.name) + staleBadge(r.s) + '</div><div class="ticker">' + esc(r.s.ticker) + '</div></td>' +
        '<td>' + fmt(r.price, 0) + '</td>' +
        '<td class="' + cls(r.pct) + '"><b>' + pct(r.pct) + '</b></td>' +
        '<td class="bar-cell"><div class="bar"><span class="mid"></span><i style="' + pos + ';background:' + color + '"></i></div></td></tr>';
    });
    return h + '</tbody></table>';
  }

  function bindTable() {
    Array.prototype.forEach.call(document.querySelectorAll("th[data-key]"), function (el) {
      el.addEventListener("click", function () {
        var k = el.getAttribute("data-key");
        if (SORT.key === k) SORT.dir *= -1;
        else { SORT.key = k; SORT.dir = (k === "sector" || k === "name") ? 1 : -1; }
        render();
      });
    });
  }

  // ---------- 시뮬레이터 ----------
  function simMarkup() {
    return '' +
      '<label>반도체·성장주 비중 <b id="gV"></b></label>' +
      '<input type="range" id="gR" min="0" max="100" step="5" value="' + SIM.growth + '">' +
      '<label>순환매·배당·방어 비중 <b id="rV"></b></label>' +
      '<input type="range" id="rR" min="0" max="100" step="5" value="' + SIM.rotation + '">' +
      '<label>현금 버퍼(자동 잔여) <b id="cV"></b></label>' +
      '<div class="alloc"><div id="aG" style="background:var(--up)"></div><div id="aR" style="background:var(--accent)"></div><div id="aC" style="background:var(--ok)"></div></div>' +
      '<div class="legend"><span style="--c:var(--up)">성장 β' + BETA.growth + '</span><span style="--c:var(--accent)">순환·방어 β' + BETA.rotation + '</span><span style="--c:var(--ok)">현금 β' + BETA.cash + '</span></div>' +
      '<div class="sim-out">' +
      '<div class="box"><div class="k">추정 포트폴리오 베타</div><div class="v" id="oBeta"></div></div>' +
      '<div class="box"><div class="k">코스피 -3% 시 예상</div><div class="v" id="oLoss"></div></div>' +
      '<div class="box"><div class="k">KODEX 200 대비 방어력</div><div class="v" id="oDef"></div></div>' +
      '</div>' +
      '<div class="note" id="oNote"></div>' +
      '<div class="note">베타는 섹터 성격에 따른 가정값(성장 ' + BETA.growth + ' · 순환/방어 ' + BETA.rotation + ' · 현금 ' + BETA.cash +
      ')이며 실제 변동성과 다를 수 있습니다.</div>';
  }

  function bindSim() {
    var g = document.getElementById("gR"), r = document.getElementById("rR");
    g.addEventListener("input", function () {
      SIM.growth = +g.value;
      if (SIM.growth + SIM.rotation > 100) { SIM.rotation = 100 - SIM.growth; r.value = SIM.rotation; }
      updateSim();
    });
    r.addEventListener("input", function () {
      SIM.rotation = +r.value;
      if (SIM.growth + SIM.rotation > 100) { SIM.growth = 100 - SIM.rotation; g.value = SIM.growth; }
      updateSim();
    });
  }

  function simResult() {
    var cash = Math.max(0, 100 - SIM.growth - SIM.rotation);
    var beta = (SIM.growth * BETA.growth + SIM.rotation * BETA.rotation + cash * BETA.cash) / 100;
    var loss = -3 * beta;
    var defense = (3 - Math.abs(loss)) / 3 * 100;   // KODEX 200(β=1, -3%) 대비 손실 절감률
    return { cash: cash, beta: beta, loss: loss, defense: defense };
  }

  function updateSim() {
    var s = simResult();
    document.getElementById("gV").textContent = SIM.growth + "%";
    document.getElementById("rV").textContent = SIM.rotation + "%";
    document.getElementById("cV").textContent = s.cash + "%";
    document.getElementById("aG").style.width = SIM.growth + "%";
    document.getElementById("aR").style.width = SIM.rotation + "%";
    document.getElementById("aC").style.width = s.cash + "%";
    document.getElementById("oBeta").textContent = s.beta.toFixed(2);
    var lossEl = document.getElementById("oLoss");
    lossEl.textContent = s.loss.toFixed(2) + "%";
    lossEl.className = "v " + cls(s.loss);
    var defEl = document.getElementById("oDef");
    defEl.textContent = (s.defense >= 0 ? "+" : "") + s.defense.toFixed(0) + "%";
    defEl.style.color = s.defense >= 0 ? "var(--ok)" : "var(--up)";

    var note;
    if (s.beta > 1.1) note = "⚠️ 공격적 배분입니다. 지수 급락·외국인 이탈 구간에서는 시장보다 크게 흔들릴 수 있습니다.";
    else if (s.beta > 0.8) note = "⚖️ 시장과 비슷한 변동성입니다. 반도체 코어는 유지하되 순환매 업종으로 일부 분산된 상태입니다.";
    else if (s.beta > 0.5) note = "🛡️ 방어형 바벨 배분입니다. 조정 구간에서 하락폭을 줄이면서 반등 참여 여지도 남겨둔 상태입니다.";
    else note = "🧊 매우 보수적인 배분입니다. 하락 방어력은 높지만 반등 시 수익 기회도 크게 줄어듭니다.";
    document.getElementById("oNote").textContent = note;

    try { localStorage.setItem("kmr_sim", JSON.stringify(SIM)); } catch (e) {}
  }

  // ---------- 요약 복사 ----------
  function buildSummary() {
    if (!DATA) return "";
    var I = DATA.indices || {}, F = DATA.flow || {}, k = pctKey();
    var fk = MODE === "daily" ? ["daily_foreign", "daily_inst"] : ["weekly_foreign", "weekly_inst"];
    var br = DATA.ai_briefing || {};
    var s = simResult();
    var sectors = (DATA.sectors || []).slice().sort(function (a, b) { return num(b[k]) - num(a[k]); });
    var lines = [];
    lines.push("[Korea Market Radar] " + modeLabel() + " · 기준 거래일 " + (DATA.trade_date || "-"));
    lines.push("");
    lines.push("■ 지수");
    lines.push("- KOSPI " + fmt((I.kospi || {}).price, 2) + " (" + pct((I.kospi || {})[k]) + ")");
    lines.push("- KOSDAQ " + fmt((I.kosdaq || {}).price, 2) + " (" + pct((I.kosdaq || {})[k]) + ")");
    lines.push("- 원/달러 " + fmt((I.usdkrw || {}).price, 1) + "원 (" + pct((I.usdkrw || {})[k]) + ")");
    lines.push("- SOX " + fmt((I.sox || {}).price, 2) + " (" + pct((I.sox || {})[k]) + ")");
    lines.push("");
    lines.push("■ 수급(억 원)");
    lines.push("- 코스피 외국인 " + signed((F.kospi || {})[fk[0]]) + " / 기관 " + signed((F.kospi || {})[fk[1]]));
    lines.push("- 코스닥 외국인 " + signed((F.kosdaq || {})[fk[0]]) + " / 기관 " + signed((F.kosdaq || {})[fk[1]]));
    lines.push("");
    lines.push("■ 섹터 ETF 순위");
    sectors.forEach(function (x, i) { lines.push((i + 1) + ". " + x.sector + " " + x.name + " " + pct(x[k])); });
    lines.push("");
    lines.push("■ AI 브리핑");
    lines.push((MODE === "daily" ? br.daily_comment : br.weekly_comment) || "-");
    lines.push("");
    lines.push("■ 내 비중 설정");
    lines.push("- 성장 " + SIM.growth + "% / 순환·방어 " + SIM.rotation + "% / 현금 " + s.cash + "%");
    lines.push("- 추정 베타 " + s.beta.toFixed(2) + " · 코스피 -3% 시 " + s.loss.toFixed(2) + "% (KODEX 200 대비 방어력 " + s.defense.toFixed(0) + "%)");
    return lines.join("\n");
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1600);
  }

  // ---------- 이벤트 ----------
  function setMode(m) {
    MODE = m;
    document.getElementById("btnDaily").classList.toggle("active", m === "daily");
    document.getElementById("btnWeekly").classList.toggle("active", m === "weekly");
    try { localStorage.setItem("kmr_mode", m); } catch (e) {}
    render();
  }
  document.getElementById("btnDaily").addEventListener("click", function () { setMode("daily"); });
  document.getElementById("btnWeekly").addEventListener("click", function () { setMode("weekly"); });
  document.getElementById("btnCopy").addEventListener("click", function () {
    if (!DATA) return toast("데이터가 아직 없습니다");
    copyText(buildSummary()).then(function () { toast("요약이 복사되었습니다"); }, function () { toast("복사에 실패했습니다"); });
  });

  setMode(MODE);
  load();
})();
</script>
</body>
</html>
